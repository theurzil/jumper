name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build -o jumper .

      - name: Test
        run: go test -race -v ./...

      - name: Vet
        run: go vet ./...

      - name: Fmt check
        run: test -z "$(gofmt -l .)"
